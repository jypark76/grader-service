# In plain English: gives the grader a steady address INSIDE the cluster. There is no outside port, so
# nothing outside the cluster can reach it directly. The grader's web side only answers the health checks.
apiVersion: v1
kind: Service
metadata:
  name: grader-service
  namespace: grader
spec:
  selector:
    app: grader-service
  ports:
    - port: 8000
      targetPort: 8000
