# In plain English: the service's NON-secret settings, kept in one place. There are no passwords here: the key for the
# knowledge service comes from a Secret (see worker-deployment.yaml). To move to AWS, change KAFKA_BOOTSTRAP to the managed Kafka address and nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grader-service-config
  namespace: grader
data:
  # Where Kafka lives inside the cluster. Only the worker uses this.
  KAFKA_BOOTSTRAP: kafka.kafka.svc.cluster.local:9092
  # Where the knowledge service lives inside the cluster: scheme, host and port only. The worker refuses anything else.
  KNOWLEDGE_URL: http://knowledge-service.knowledge.svc.cluster.local:8000
