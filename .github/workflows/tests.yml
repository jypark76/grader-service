# In plain English: this tells GitHub to run the automated tests every time
# someone opens or updates a pull request, and every time something lands on
# main. If any test fails, the check turns red. Once the branch rules on GitHub
# require this check ("tests"), a red check blocks the merge.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code, nothing more.
permissions:
  contents: read

jobs:
  # In plain English: the first job runs EVERY test file except the Kubernetes file checks (they have their own
  # job below). The grader has no database, so nothing is skipped here.
  # OWASP_ENFORCE_COVERAGE=1 turns on the guardrail coverage check (tests/owasp_report.py): the run fails if a
  # CWE listed in expected-coverage.txt has no passing test, or a test is tagged with a CWE that is not listed.
  # It also writes the coverage table to the run summary page.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Python version as the Dockerfile, so tests match the real service.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install --require-hashes -r requirements-dev.txt

      - name: Run the tests
        env:
          OWASP_ENFORCE_COVERAGE: "1"
        run: pytest -v --ignore=tests/test_k8s_manifests.py

  # In plain English: the second job. It checks the Kubernetes files before they
  # ever reach a cluster: the shell script is checked with shellcheck, and
  # the final laptop files are built and checked against our rules (right
  # namespace, no Secret, fixed image tags, locked-down service pod and so on).
  # REQUIRE_KUBECTL=1 makes a missing kubectl a failure and not a quiet skip.
  kubernetes-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install --require-hashes -r requirements-dev.txt

      - name: Check the shell script
        run: shellcheck k8s/deploy.sh

      - name: Check the rendered Kubernetes files
        env:
          REQUIRE_KUBECTL: "1"
        run: pytest -v tests/test_k8s_manifests.py

  # In plain English: the third job. It builds the real Docker image, the same one
  # the cluster runs, and starts it with the network switched off. Then it checks
  # the things the other jobs take on trust: the service answers /health and
  # /ready, the service runs as user 1000 and not as root, and nothing that
  # should stay out of the image got in.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t grader-service:ci .

      # --network none means the container cannot reach the internet.
      - name: Start it with the network off
        run: docker run -d --name image-test --network none grader-service:ci

      - name: Wait for the service to answer
        run: |
          for attempt in $(seq 1 30); do
            if docker exec image-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
              exit 0
            fi
            sleep 1
          done
          echo "The service did not start in time." >&2
          docker logs image-test >&2
          exit 1

      - name: Check /health and /ready
        run: |
          for path in health ready; do
            reply="$(docker exec image-test python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/$path').read().decode())")"
            if [ "$reply" != '{"ok":true}' ]; then
              echo "Unexpected /$path reply: $reply" >&2
              exit 1
            fi
          done

      # The documentation pages are switched off on purpose: they must answer 404.
      - name: Check the documentation pages are closed
        run: |
          docker exec -i image-test python - <<'PY'
          import urllib.error
          import urllib.request

          for path in ("/docs", "/redoc", "/openapi.json"):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000" + path, timeout=5)
              except urllib.error.HTTPError as error:
                  assert error.code == 404, (path, error.code)
              else:
                  raise SystemExit("expected a 404 from " + path)
          PY

      - name: Check it runs as user 1000
        run: |
          user_id="$(docker exec image-test id -u)"
          if [ "$user_id" != "1000" ]; then
            echo "The service runs as user $user_id, expected 1000" >&2
            exit 1
          fi

      # Only the code and the list of libraries (the Dockerfile copies it in to install them) should be in
      # /app. The tests, the Kubernetes files and any notes must stay out, and so must anything that looks like
      # a secret.
      - name: Check only the expected files are inside
        run: |
          contents="$(docker exec image-test ls -A /app | sort | tr '\n' ' ')"
          if [ "$contents" != "app requirements.txt " ]; then
            echo "Unexpected files in /app: $contents" >&2
            exit 1
          fi
          suspicious="$(docker exec image-test find /app \( -name '.env*' -o -name '*.pem' -o -name '*.key' -o -iname '*secret*' \) ! -path /app/app/secret_files.py)"
          if [ -n "$suspicious" ]; then
            echo "Files that look like secrets are inside the image:" >&2
            echo "$suspicious" >&2
            exit 1
          fi

      - name: Show the service log
        if: failure()
        run: docker logs image-test

      - name: Clean up
        if: always()
        run: docker rm -f image-test
